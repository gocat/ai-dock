name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and self-test
    # The launcher buttons use a macOS 26 control size, so the image needs the
    # matching SDK. macos-26 is generally available and runs on Apple silicon.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version
          python3 -V

      # build.sh regenerates the app icon, compiles, ad-hoc signs the bundle and
      # finishes with the built-in --self-test run, so a failure here is a real one.
      # The log tail is republished as annotations because job logs are only
      # readable by repository admins.
      - name: Build and self-test
        run: |
          set +e
          bash build.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "build.sh exited with $status"
            tail -n 12 build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"
